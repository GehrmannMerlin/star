# Web 容器静态服务（仅供后端反代取静态；/api 由域名层 nginx 路由到 backend）。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
