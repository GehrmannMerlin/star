# Stellaris public TLS vhosts (active after certificates issued).
# Loaded via bind mount into the shared Lumina nginx container (same pattern as aurora).
# Serves:
#   stellaris.ac.cn             -> web SPA (static) + /api -> backend
# TLS cert from host certbot at /etc/letsencrypt/live/stellaris.ac.cn/
#
# NOTE: this file is bind-mounted by the Lumina nginx container. Paths below are
# inside that container. Backend resolves via Docker DNS (resolver 127.0.0.11).

server {
    listen 80;
    listen [::]:80;
    server_name stellaris.ac.cn;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://stellaris.ac.cn$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stellaris.ac.cn;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/stellaris.ac.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stellaris.ac.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:StellarisTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API 反代到 backend 容器（Docker DNS 解析）。
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $stellaris_backend http://stellaris-backend:3000;
        proxy_pass $stellaris_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off; # SSE 事件流
    }

    # 健康检查反代到 backend。
    location = /health {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $stellaris_backend_health http://stellaris-backend:3000;
        proxy_pass $stellaris_backend_health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Web 静态（web 容器）。
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $stellaris_web http://stellaris-web:80;
        proxy_pass $stellaris_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
