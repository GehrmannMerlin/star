server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /zhengwujianli {
        return 301 /zhengwujianli/;
    }

    location /zhengwujianli/assets/ {
        rewrite ^/zhengwujianli/(.*)$ /$1 break;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /zhengwujianli/ {
        rewrite ^/zhengwujianli/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
