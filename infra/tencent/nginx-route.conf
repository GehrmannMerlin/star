# Include this marker block from the portal's HTTPS server block.
location = /zhengwujianli {
    return 301 /zhengwujianli/;
}

location = /_stellaris_session_verify {
    internal;
    proxy_pass http://127.0.0.1:3003/api/stellaris-session/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URI $request_uri;
}

location /zhengwujianli/api/ {
    auth_request /_stellaris_session_verify;
    auth_request_set $stellaris_user_id $upstream_http_x_ifc_user_id;
    proxy_set_header X-IFC-User-ID $stellaris_user_id;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:3217/api/;
}

location @stellaris_login_redirect {
    return 302 "/?redirect=%2Fzhengwujianli%2F&reauth=1";
}

location /zhengwujianli/ {
    auth_request /_stellaris_session_verify;
    error_page 401 = @stellaris_login_redirect;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:3218;
}
